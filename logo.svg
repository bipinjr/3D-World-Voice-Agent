<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Command the Future logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="planet" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#9ff6ff"/>
      <stop offset=".45" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#3a1d9a"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38e1ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="#0a1024"/>
  <circle cx="64" cy="64" r="44" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#fff"><circle cx="22" cy="24" r="1.6"/><circle cx="104" cy="20" r="1.2"/><circle cx="18" cy="96" r="1.2"/><circle cx="108" cy="104" r="1.6"/><circle cx="96" cy="38" r="1"/></g>
  <!-- orbit (back half) -->
  <g transform="rotate(-20 64 64)"><path d="M18 64 A46 14 0 0 1 110 64" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity=".55"/></g>
  <!-- planet -->
  <circle cx="64" cy="64" r="27" fill="url(#planet)"/>
  <!-- voice wave -->
  <g fill="#fff">
    <rect x="47" y="59" width="5" height="10" rx="2.5"/>
    <rect x="55" y="52" width="5" height="24" rx="2.5"/>
    <rect x="63" y="46" width="5" height="36" rx="2.5"/>
    <rect x="71" y="52" width="5" height="24" rx="2.5"/>
    <rect x="79" y="59" width="5" height="10" rx="2.5"/>
  </g>
  <!-- orbit (front half) + moon -->
  <g transform="rotate(-20 64 64)">
    <path d="M18 64 A46 14 0 0 0 110 64" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="94" cy="74.5" r="6" fill="#ffc94d"/>
  </g>
</svg>
